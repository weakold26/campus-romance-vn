<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>도서관 창가 3번 자리</title>
<meta name="description" content="시험기간 5일, 축제 전야. 도서관 창가 자리에서 시작된 캠퍼스 로맨스 비주얼 노벨.">
<meta name="theme-color" content="#1c2430">
<meta property="og:title" content="도서관 창가 3번 자리">
<meta property="og:description" content="시험까지 닷새, 축제까지 나흘. 창가 세 번째 자리에서 만난 두 사람과의 5일.">
<meta property="og:type" content="website">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23fbf5ea'/%3E%3Cpath d='M26 30h22v44H26zM52 30h22v44H52z' fill='%23cf8a95'/%3E%3Cpath d='M26 30h22v6H26zM52 30h22v6H52z' fill='%239db99a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=9">
</head>
<body class="loading is-title">

<div id="app">
  <div id="stage">
    <div class="bg-layer" aria-hidden="true">
      <div class="bg" id="bgA"></div>
      <div class="bg" id="bgB"></div>
      <div class="bg-tint"></div>
    </div>

    <div class="char-layer" id="char-layer" aria-hidden="true">
      <img class="char char--side" id="charSide" alt="">
      <img class="char char--main" id="charMain" alt="">
    </div>

    <div class="fx-layer" aria-hidden="true">
      <div class="rain" id="rain"><i></i><i></i><i></i></div>
      <div class="dust" id="dust"></div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <div id="chapter-card" aria-hidden="true"></div>

    <div class="ui-layer">
      <div id="hud">
        <div id="chapter-chip">1일차</div>
        <div class="affs">
          <div class="aff" data-k="seoyun">
            <span class="nm">서윤</span>
            <span class="bar"><i></i></span>
            <span class="num">0</span>
          </div>
          <div class="aff" data-k="chaewon">
            <span class="nm">채원</span>
            <span class="bar"><i></i></span>
            <span class="num">0</span>
          </div>
        </div>
      </div>

      <div id="topbar">
        <button id="btn-log" class="icon" type="button" aria-label="백로그">로그</button>
        <button id="btn-auto" class="icon" type="button" aria-label="자동 진행">자동</button>
        <button id="btn-skip" class="icon" type="button" aria-label="빠르게 넘기기">스킵</button>
        <button id="btn-save" class="icon" type="button" aria-label="저장">저장</button>
        <button id="btn-load" class="icon" type="button" aria-label="불러오기">불러오기</button>
        <button id="btn-bgm" class="icon" type="button" aria-label="소리 끄기">♪</button>
        <button id="btn-menu" class="icon" type="button" aria-label="설정">설정</button>
      </div>

      <div id="choices" role="group" aria-label="선택지"></div>

      <div id="dialogue">
        <div id="namebox"><span id="name"></span></div>
        <div id="text"></div>
        <span id="next-ind" aria-hidden="true">▼</span>
      </div>
    </div>
  </div>

  <section id="title-screen">
    <div class="title-bg"></div>
    <div class="title-inner">
      <p class="kicker">CAMPUS ROMANCE · MAY</p>
      <h1>도서관 창가<br><em>3번 자리</em></h1>
      <p class="tagline">시험까지 닷새, 축제까지 나흘.<br>창가 세 번째 자리에서 시작된 5일.</p>
      <div id="title-menu">
        <button id="btn-start" class="btn" type="button">처음부터</button>
        <button id="btn-continue" class="btn ghost" type="button">이어서 하기</button>
        <button id="btn-gallery" class="btn ghost" type="button">
          엔딩 도감 <span class="sub" id="gallery-count">0 / 5</span>
        </button>
        <button id="title-sound" class="link" type="button">소리 · 켜짐</button>
      </div>
      <div class="loader"><div id="loader-bar"></div></div>
      <p class="credit">A VISUAL NOVEL · 5 DAYS</p>
    </div>
  </section>

  <section id="ending-screen" aria-live="polite"></section>

  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modal-title">저장</h3>
        <button id="modal-close" type="button" aria-label="닫기">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>
</div>

<script src="js/audio.js?v=2"></script>
<script src="js/engine.js?v=6"></script>
</body>
</html>
